services:
  # ============================================================
  # 1. PostgreSQL 16 Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hoteluser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotelpassword}
      POSTGRES_DB: ${DB_NAME:-hoteldb}
      TZ: Asia/Kolkata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hoteluser} -d ${DB_NAME:-hoteldb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. Hotel Backend (Go REST API)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hoteluser}
      DB_PASSWORD: ${DB_PASSWORD:-hotelpassword}
      DB_NAME: ${DB_NAME:-hoteldb}
      DB_SSLMODE: disable
      DATABASE_URL: postgres://${DB_USER:-hoteluser}:${DB_PASSWORD:-hotelpassword}@postgres:5432/${DB_NAME:-hoteldb}?sslmode=disable
      DB_DRIVER: postgres
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      DEFAULT_CURRENCY: INR
      DEFAULT_TAX_RATE: 0.12
      DEFAULT_COUNTRY: India
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: hotel_postgres_data
